name: MoonBit CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, Strict Typecheck, 3-Backend Tests, Theorem & M1–M6 Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js (for JS backend verification)
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install latest stable MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Report MoonBit toolchain versions
        run: moon version --all

      - name: Gate 1 — Enforce zero formatting drift (moon fmt --check)
        run: moon fmt --check

      - name: Gate 2 — Enforce zero warnings & zero errors (moon check --deny-warn)
        run: moon check --deny-warn

      - name: Gate 3 — Enforce zero public API (.mbti) drift (moon info)
        run: |
          moon info
          git diff --exit-code pkg.generated.mbti

      - name: Gate 4 — Run unit, regression, theorem & doctests (wasm-gc)
        run: moon test --target wasm-gc

      - name: Gate 5 — Run cross-backend verification (wasm)
        run: moon test --target wasm

      - name: Gate 6 — Run cross-backend verification (js)
        run: moon test --target js

      - name: Gate 7 — Run theorem, M1–M6 CLI & problem-set acceptance
        run: |
          OUT="$(moon run cmd/main)"
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" | grep -Fq "18 / 18 theorems verified."
          printf '%s\n' "$OUT" | grep -Fq "SGNE-Syn-Mem-Para"
          printf '%s\n' "$OUT" | grep -Fq "26 structures"
          printf '%s\n' "$OUT" | grep -Fq "[M1.1]"
          printf '%s\n' "$OUT" | grep -Fq "PASS = true"
          printf '%s\n' "$OUT" | grep -Fq "four clusters = true"
          printf '%s\n' "$OUT" | grep -Fq "changed = true"
          printf '%s\n' "$OUT" | grep -Fq "reversible = true"
          printf '%s\n' "$OUT" | grep -Fq "[Quality] Removed the zero-weight"
          printf '%s\n' "$OUT" | grep -Fq "[M1.3] requested/completed = 100000/100000"
          printf '%s\n' "$OUT" | grep -Fq "max trajectory dF = 0.00e+00"
          printf '%s\n' "$OUT" | grep -Fq "equilibrium residual ="
          printf '%s\n' "$OUT" | grep -Fq "failed steps = 0 | PASS = true"
          printf '%s\n' "$OUT" | grep -Fq "[M1.4] H samples"
          printf '%s\n' "$OUT" | grep -Fq "mean-increasing = true"
          printf '%s\n' "$OUT" | grep -Fq "each-role-increasing = true"
          printf '%s\n' "$OUT" | grep -Fq "role order = true | PASS = true"
          printf '%s\n' "$OUT" | grep -Fq "[M2.1] MP/cut/substitution coverage = 4294967296/4294967296/4294967296 of 4294967296"
          printf '%s\n' "$OUT" | grep -Fq "| sound = true | PASS = true"
          printf '%s\n' "$OUT" | grep -Fq "[M2.2] inspected/repaired/unresolved = 2/1/1"
          printf '%s\n' "$OUT" | grep -Fq "cut blocked = true | non-explosion = true | PASS = true"
          printf '%s\n' "$OUT" | grep -Fq "[M2.3] B_4 product information join"
          printf '%s\n' "$OUT" | grep -Fq "A/C/I = true/true/true | LUB = true | named supports = true | PASS = true"
          printf '%s\n' "$OUT" | grep -Fq "[M2.4] Gödel finite belief sets | samples = 9 | subsets = 32768"
          printf '%s\n' "$OUT" | grep -Fq "round-trip/injective = true/true | union/intersection ACI = true/true | identity/zero/absorption = true/true/true | distributive = true"
          printf '%s\n' "$OUT" | grep -Fq "difference/symmetric-difference/subset = true/true/true | PASS = true"

          printf '%s\n' "$OUT" | grep -Fq "[M3.1] patches = 2..6"
          printf '%s\n' "$OUT" | grep -Fq "all sections glue = true | PASS = true"
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M3\.2\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M3\.3\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M4\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M5\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M6\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Fq "[Mora.NF] non-well-order x - x^2"
          printf '%s\n' "$OUT" | grep -Fq "NF=0: true | terminates = true"
          printf '%s\n' "$OUT" | grep -Fq "[Mora.SB] <xy, x^2-y^3> | basis=3 | pairs=3 | standard=true"
          printf '%s\n' "$OUT" | grep -Fq "[Newton] toric/koszul split"
          printf '%s\n' "$OUT" | grep -Fq "| PASS = true"
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M4\.2\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M6\.2\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Fq "[Mora] local standard basis + NF termination + tangent cone certified = true"
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M4\.3\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M5\.2\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M6\.3\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M7\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M8\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M6\.4\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M9\].*\| PASS = true$'
          printf '%s\n' "$OUT" | grep -Eq '^[[:space:]]+\[M10\].*\| PASS = true$'
          python3 -c "
          import json
          with open('benchmarks/emergence_problem_set.json', encoding='utf-8') as f:
              d = json.load(f)
          ps = d['problems']
          ids = [p['id'] for p in ps]
          assert len(ids) == len(set(ids)), 'duplicate problem ids'
          assert len(ps) >= 30, 'problem set too small'
          for p in ps:
              assert p['kind'] in d['kinds'], p['id']
              assert p['layer'].startswith('Tier'), p['id']
              assert 'module' in p and 'function' in p, p['id']
          print('problem set OK: %d problems' % len(ps))
          "
